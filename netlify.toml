# Static site: no build step. The dashboard and its analysis feed are served as-is.
[build]
  publish = "."

[[headers]]
  for = "/feed.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
